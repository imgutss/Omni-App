name: guts

on:
  push:
    branches: ['**']
    paths: ['guts/**', '.github/workflows/guts.yml', 'guts/**']
  pull_request:
    paths: ['guts/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Vet and test
        working-directory: guts
        run: |
          gofmt -l . | tee /tmp/fmt.txt
          test ! -s /tmp/fmt.txt
          go vet ./...
          go test ./... -count=1

      - name: End to end through a door
        working-directory: guts
        run: ./scripts/smoke.sh
