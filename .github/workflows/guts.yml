name: guts

on:
  push:
    branches: ['**']
    paths: ['guts/**', '.github/workflows/guts.yml', 'guts/**']
  pull_request:
    paths: ['guts/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Vet and test
        working-directory: guts
        run: |
          gofmt -l . | tee /tmp/fmt.txt
          test ! -s /tmp/fmt.txt
          go vet ./...
          go test ./... -count=1

      - name: End to end through a door
        working-directory: guts
        run: ./scripts/smoke.sh

  # The phone runs the same client the command line does: the app spawns it the way it already
  # spawns the DNS tunnel engines, and Xray dials the SOCKS port it opens. Android will only execute
  # a binary it finds in the APK's native library directory, so each ABI is built here and packaged
  # as libguts.so, exactly like the other bundled engines.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: arm64, abi: arm64-v8a }
          - { goarch: arm,   abi: armeabi-v7a, extra: 'GOARM=7' }
          - { goarch: '386', abi: x86 }
          - { goarch: amd64, abi: x86_64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Build the client for ${{ matrix.abi }}
        working-directory: guts
        env:
          CGO_ENABLED: '0'
          GOOS: android
          GOARCH: ${{ matrix.goarch }}
          GOARM: '${{ matrix.extra }}'
        run: |
          mkdir -p ../guts-android/${{ matrix.abi }}
          go build -trimpath -ldflags='-s -w' -o ../guts-android/${{ matrix.abi }}/libguts.so ./cmd/gutsclient
          ls -l ../guts-android/${{ matrix.abi }}/libguts.so

      - uses: actions/upload-artifact@v4
        with:
          name: guts-client-${{ matrix.abi }}
          path: guts-android/${{ matrix.abi }}/libguts.so
